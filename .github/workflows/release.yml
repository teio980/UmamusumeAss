name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact stable version.txt value, for example 0.3.0'
        required: true
        type: string
      bundled_resource_version:
        description: 'Resource revision embedded in the program package (defaults to program version)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      TESSDATA_PREFIX: ${{ github.workspace }}/resource/tessdata
      UMA_NUMERIC_OCR_WORKER_PATH: ${{ github.workspace }}/build/release/src/UmaAssistantCore/Release/UmaNumericOcrWorker.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install WebP WIC Codec
        shell: pwsh
        run: |
          $installerPath = "$env:TEMP\WebpCodecSetup.exe"
          $msiPath = "$env:TEMP\webp_x64.msi"
          Invoke-WebRequest -Uri "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/WebpCodecSetup.exe" -OutFile $installerPath
          $bytes = [System.IO.File]::ReadAllBytes($installerPath)
          $sig = [byte[]](0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1)
          $offsets = [System.Collections.Generic.List[int]]::new()
          for ($i = 0; $i -le $bytes.Length - $sig.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $sig.Length; $j++) {
                  if ($bytes[$i + $j] -ne $sig[$j]) { $match = $false; break }
              }
              if ($match) { $offsets.Add($i) }
          }
          if ($offsets.Count -ge 2) {
              $msiOffset = $offsets[1]
              $msiBytes = [byte[]]::new($bytes.Length - $msiOffset)
              [System.Array]::Copy($bytes, $msiOffset, $msiBytes, 0, $msiBytes.Length)
              [System.IO.File]::WriteAllBytes($msiPath, $msiBytes)
              Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /quiet /qn /norestart" -Wait -NoNewWindow
              Write-Host "WebP WIC Codec installed successfully."
          } else {
              Write-Warning "Could not find x64 MSI signature in WebpCodecSetup.exe"
          }
      - name: Validate release inputs
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -ne '${{ inputs.version }}') { throw "version.txt is $v, not the requested version" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'version must be stable semver' }
      - name: Build and test native code
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/release -G 'Visual Studio 17 2022' -A x64 -DUMA_BUILD_TESTS=ON
          cmake --build build/release --config Release
          cmake --install build/release --prefix build/native-staging --config Release
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Test managed code
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test tests/Umamusume.UpdateCore.Tests/Umamusume.UpdateCore.Tests.csproj --configuration Release
          dotnet restore tests/UmamusumeWpfGui.Tests/UmamusumeWpfGui.Tests.csproj
          dotnet test tests/UmamusumeWpfGui.Tests/UmamusumeWpfGui.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~PackageLayoutTests"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows program
        shell: pwsh
        run: |
          $bv = '${{ inputs.bundled_resource_version }}'
          if ([string]::IsNullOrWhiteSpace($bv)) { $bv = '${{ inputs.version }}' }
          ./tools/package.ps1 -OutputDirectory dist -BundledResourceVersion $bv -BuildInstaller
      - uses: actions/upload-artifact@v6
        with:
          name: release-input-windows
          path: |
            dist/*-win-x64-full.zip
            dist/*-win-x64-setup.exe

  build-macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # macos-15 defaults to Xcode 16.4, whose libc++ lacks stop_token/jthread.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TESSDATA_PREFIX: ${{ github.workspace }}/resource/tessdata
      UMA_NUMERIC_OCR_WORKER_PATH: ${{ github.workspace }}/build/osx-arm64/src/UmaAssistantCore/UmaNumericOcrWorker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify ARM64 runner and release inputs
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun clang++ --version
          test "$(tr -d '[:space:]' < version.txt)" = '${{ inputs.version }}'
      - name: Install Ninja
        run: brew install ninja
      - name: Configure and build native code
        run: |
          cmake --preset osx-arm64 -DUMA_BUILD_TESTS=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build --preset osx-arm64 -j"$(sysctl -n hw.ncpu)"
      - name: Test native code
        run: ctest --test-dir build/osx-arm64 --output-on-failure -E 'LiveBlueStacks'
      - name: Test managed macOS code
        run: |
          dotnet test tests/Umamusume.AppCore.Tests/Umamusume.AppCore.Tests.csproj -c Release --filter 'FullyQualifiedName!~LiveDeviceVerificationTests'
          dotnet test tests/Umamusume.Avalonia.Tests/Umamusume.Avalonia.Tests.csproj -c Release
          dotnet test tests/Umamusume.CoreBridge.Tests/Umamusume.CoreBridge.Tests.csproj -c Release
          dotnet test tests/Umamusume.MacUpdater.Tests/Umamusume.MacUpdater.Tests.csproj -c Release
          dotnet test tests/Umamusume.UpdateCore.Tests/Umamusume.UpdateCore.Tests.csproj -c Release
      - name: Package arm64 app bundle
        env:
          UMA_BUNDLED_RESOURCE_VERSION: ${{ inputs.bundled_resource_version }}
        run: ./tools/package_macos.sh "$GITHUB_WORKSPACE/build/osx-arm64" "$GITHUB_WORKSPACE/dist"
      - name: Verify app package
        run: ./tools/verify_macos_package.sh dist/UmamusumeAss-osx-arm64.app.zip
      - uses: actions/upload-artifact@v6
        with:
          name: release-input-macos
          path: |
            dist/UmamusumeAss-*-osx-arm64.app.zip
            dist/UmamusumeAss-osx-arm64.app.zip

  publish-drafts:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-input-windows
          path: release-input-windows
      - uses: actions/download-artifact@v7
        with:
          name: release-input-macos
          path: release-input-macos
      - name: Prepare draft release assets
        id: prepare
        shell: bash
        run: |
          v="${{ inputs.version }}"
          mkdir -p release
          win_zip=$(find release-input-windows -name "UmamusumeAss-v${v}-win-x64-full.zip" | head -n 1)
          win_setup=$(find release-input-windows -name "UmamusumeAss-v${v}-win-x64-setup.exe" | head -n 1)
          mac_zip=$(find release-input-macos -name "UmamusumeAss-v${v}-osx-arm64.app.zip" | head -n 1)
          if [ -z "$mac_zip" ]; then
            mac_zip=$(find release-input-macos -name "UmamusumeAss-osx-arm64.app.zip" | head -n 1)
            cp "$mac_zip" "release/UmamusumeAss-v${v}-osx-arm64.app.zip"
            mac_zip="release/UmamusumeAss-v${v}-osx-arm64.app.zip"
          else
            cp "$mac_zip" release/
            mac_zip="release/$(basename "$mac_zip")"
          fi
          cp "$win_zip" release/
          cp "$win_setup" release/
          echo "win_zip=release/$(basename "$win_zip")" >> "$GITHUB_OUTPUT"
          echo "win_setup=release/$(basename "$win_setup")" >> "$GITHUB_OUTPUT"
          echo "mac_zip=$mac_zip" >> "$GITHUB_OUTPUT"
      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          gh release create "v$v" \
            "${{ steps.prepare.outputs.win_zip }}" \
            "${{ steps.prepare.outputs.win_setup }}" \
            "${{ steps.prepare.outputs.mac_zip }}" \
            --draft \
            --title "UmamusumeAss v$v" \
            --notes $'### 升级说明\n\n- **旧版本用户**：须完全关闭正在运行的旧版本应用，手动下载并覆盖安装或解压运行新版一次。此后可在应用内自动检查并重启更新。\n- **Windows**：自动更新使用 `UmamusumeAss-v'"$v"'-win-x64-full.zip`；手动安装用户亦可下载 `UmamusumeAss-v'"$v"'-win-x64-setup.exe`。\n- **macOS**：自动更新使用 `UmamusumeAss-v'"$v"'-osx-arm64.app.zip`。\n\n请在发布前核对附件列表及 SHA-256 摘要。'
