# Cross-platform CI workflow: Windows (x64) and macOS (ARM64).
#
# Windows runs native C++ core, WPF GUI client (UmamusumeWpfGui), and tests.
# macOS runs native C++ core, Avalonia macOS client (Umamusume.Avalonia), and packages .app bundle ZIP.

name: Build, Test, and Package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    name: Windows x64 (Native Core + WPF GUI)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Configure CMake (Release)
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        shell: pwsh

      - name: Build (Release)
        run: cmake --build build/release --config Release
        shell: pwsh

      - name: Run CTest (Release)
        run: ctest --test-dir build/release -C Release --output-on-failure
        shell: pwsh

      - name: Run Managed Unit Tests
        run: |
          dotnet test tests/Umamusume.AppCore.Tests/Umamusume.AppCore.Tests.csproj -c Release
          dotnet test tests/Umamusume.Avalonia.Tests/Umamusume.Avalonia.Tests.csproj -c Release
          dotnet test tests/Umamusume.CoreBridge.Tests/Umamusume.CoreBridge.Tests.csproj -c Release
          dotnet test tests/UmamusumeWpfGui.Tests/UmamusumeWpfGui.Tests.csproj -c Release --filter "FullyQualifiedName~PackageLayoutTests"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Package Portable ZIP and Windows Installer
        run: tools/package.ps1 -BuildInstaller
        shell: pwsh

      - name: Verify Packages Exist
        run: |
          $zip = "dist/UmamusumeAss-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "ZIP not found at expected path: $zip"
          }
          $installer = Get-ChildItem -LiteralPath "dist" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer not found in dist"
          }
          Write-Host "WPF ZIP exists: $zip"
          Write-Host "Installer exists: $($installer.FullName)"
        shell: pwsh

      - name: Upload Windows Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: UmamusumeAss-win-x64
          path: |
            dist/UmamusumeAss-win-x64.zip
            dist/*-setup.exe
          retention-days: 7

  build-macos:
    name: macOS ARM64 (Native Core + Avalonia .app)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Build Tools (Ninja)
        run: brew install ninja
        shell: bash

      - name: Configure CMake (Release)
        run: cmake --preset osx-arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
        shell: bash

      - name: Build CMake (Release)
        run: cmake --build --preset osx-arm64 -j$(sysctl -n hw.ncpu)
        shell: bash

      - name: Run CTest (Release)
        run: ctest --test-dir build/osx-arm64 --output-on-failure -E "LiveBlueStacks"
        shell: bash

      - name: Run Managed Unit Tests
        run: |
          dotnet test tests/Umamusume.AppCore.Tests/Umamusume.AppCore.Tests.csproj -c Release --filter 'FullyQualifiedName!~LiveDeviceVerificationTests'
          dotnet test tests/Umamusume.Avalonia.Tests/Umamusume.Avalonia.Tests.csproj -c Release
          dotnet test tests/Umamusume.CoreBridge.Tests/Umamusume.CoreBridge.Tests.csproj -c Release
          dotnet test tests/Umamusume.MacUpdater.Tests/Umamusume.MacUpdater.Tests.csproj -c Release
        shell: bash

      - name: Package macOS .app Bundle ZIP
        run: ./tools/package_macos.sh "$GITHUB_WORKSPACE/build/osx-arm64"
        shell: bash

      - name: Verify macOS Packages Exist
        run: |
          if [ ! -f "dist/UmamusumeAss-osx-arm64.app.zip" ]; then
            echo "Error: dist/UmamusumeAss-osx-arm64.app.zip not found" >&2
            exit 1
          fi
          ./tools/verify_macos_package.sh "dist/UmamusumeAss-osx-arm64.app.zip"
          echo "macOS ARM64 .app ZIP generated successfully:"
          ls -lh dist/UmamusumeAss-osx-arm64.app.zip
        shell: bash

      - name: Upload macOS Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: UmamusumeAss-osx-arm64
          path: dist/UmamusumeAss-osx-arm64.app.zip
          retention-days: 7
