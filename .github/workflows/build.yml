# Phase 6 CI workflow: build, test, package, and upload artifact.
#
# This workflow runs on every push and pull_request to main/master.
# It builds the native C++20 DLL and the managed .NET 10 WPF app,
# runs all CTest tests (including the managed bridge and WPF GUI
# tests), validates the portable ZIP layout, and uploads the final
# artifact.
#
# The real-emulator hardware smoke test is a separate documented
# release gate run on a controlled Windows machine — it is NOT
# part of this CI workflow.

name: Build, Test, and Package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    # The project targets the Visual Studio 17 2022 CMake generator.
    # Keep the runner pinned so windows-latest image migrations cannot remove it.
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Configure CMake (Release)
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        shell: pwsh

      - name: Build (Release)
        run: cmake --build build/release --config Release
        shell: pwsh

      - name: Run CTest (Release)
        run: ctest --test-dir build/release -C Release --output-on-failure
        shell: pwsh

      - name: Run Package Layout Tests
        run: dotnet test tests/UmamusumeWpfGui.Tests/UmamusumeWpfGui.Tests.csproj -c Release --filter "FullyQualifiedName~PackageLayoutTests"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Package Portable ZIP and Windows Installer
        run: tools/package.ps1 -BuildInstaller
        shell: pwsh

      - name: Verify Packages Exist
        run: |
          $zip = "dist/UmamusumeAss-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "ZIP not found at expected path: $zip"
          }
          $installer = Get-ChildItem -LiteralPath "dist" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer not found in dist"
          }
          Write-Host "ZIP exists and is ready for upload: $zip"
          Write-Host "Installer exists and is ready for upload: $($installer.FullName)"
        shell: pwsh

      # Upload the final artifact even if some steps above failed
      # (e.g. a test failure), so the ZIP can be inspected.
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: UmamusumeAss-win-x64
          path: |
            dist/UmamusumeAss-win-x64.zip
            dist/*-setup.exe
          retention-days: 7
